<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Assets/js/css/style.css">
    
    <title>Billetera digital</title>
</head>

    <body class = "d-flex flex-column min-vh-100">
<header class="text-center mt-4">
    <h1>Billetera digital</h1>
    <p>Una billetera digital segura y fácil de usar</p>
</header>

<main class="flex-grow-1 d-flex align-items-center justify-content-center">



<div class="container" style="max-width: 400px;">
    <h2 class="mb-4 text-center">Iniciar sesion</h2>
    <form id ="loginForm">
        <!-- Cambio de form-group a mb-3 y se agrega form-label -->
        <div class="mb-3">
            <label for="email" class="form-label">Correo:</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email">
            
        </div>
        
        <!-- Cambio de form-group a mb-3 y se agrega form-label -->
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña:</label>
            <input type="password" class="form-control" id="password" placeholder="Enter password">
            
           
        </div>
        
        <!-- Agregué w-100 para que el botón ocupe todo el ancho y mb-2 para separarlo del enlace -->
        <button type="submit" class="btn btn-primary w-100 mb-2">Login</button>
    </form>
    
    
  
</div>
    </main>
<footer class="text-center mt-5">
    <p>Sitio web creado por Matias Badilla</p>
</footer>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

</body>
<script src="Assets/js/script.js"></script>

</html>
