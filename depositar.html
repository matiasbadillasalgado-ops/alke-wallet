<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Assets/js/css/style.css">
    <title>Depositar</title>
</head>

<body>
<div class="container mt-5">
    <h2>Depositar</h2>

    <!-- REQUISITO 1: Mostrar el saldo actual -->
    <h4 class="text-secondary mb-4">Saldo Actual: <span id="saldoEnPantalla" class="text-success">$0</span></h4>

    <!-- REQUISITO 3: Contenedor para la alerta de Bootstrap -->
    <div id="alert-container" style="min-height: 60px;"></div>

    <!-- Se agregó id="formularioDeposito" para que jQuery lo reconozca -->
    <form id="formularioDeposito">
      <div class="form-group mb-3">
        <label for="depositAmount">Monto a depositar:</label>
        <input type="number" class="form-control" id="depositAmount" placeholder="Enter amount" required>
      </div>
      <button type="submit" class="btn btn-primary">Realizar depósito</button>
    </form>

    <!-- REQUISITO 2: Leyenda con el monto depositado -->
    <div id="leyendaDeposito" class="mt-3 fw-bold text-success"></div>

    <br>
    <a href="menu.html" class="btn btn-secondary mt-3">Volver al Menú Principal</a>
</div>

<!-- LIBRERÍA JQUERY: Obligatoria para que funcionen los comandos con el signo $ -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="Assets/js/script.js"></script>

</body>
</html>
