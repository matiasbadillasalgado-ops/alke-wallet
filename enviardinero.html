<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Assets/js/css/style.css">
    <title>Enviar Dinero</title>
</head>
<body class="d-flex flex-column min-vh-100">

<div class="container mt-5">
    <h2>Enviar Dinero</h2>
    
    <!-- Muestra el saldo para que sepa cuánto puede enviar -->
    <h4 class="text-secondary mb-4">Saldo Disponible: <span id="saldoEnPantalla" class="text-success">$0</span></h4>

    <!-- REQUISITO 3: Buscador de contactos -->
    <input type="text" id="buscadorContacto" class="form-control mb-3" placeholder="Buscar contacto por nombre o alias...">

    <!-- Lista de Agenda -->
    <ul class="list-group mb-3" id="listaContactos">
        <!-- Estos son contactos de prueba -->
        <li class="list-group-item list-group-item-action contacto-item" data-nombre="Juan Perez">Juan Perez (Alias: juanito)</li>
        <li class="list-group-item list-group-item-action contacto-item" data-nombre="Maria Gomez">Maria Gomez (Alias: mari.g)</li>
    </ul>

    <!-- Botón para mostrar el formulario de nuevo contacto -->
    <button id="btnMostrarFormulario" class="btn btn-outline-primary mb-3">Agregar nuevo contacto</button>

    <!-- REQUISITO 1: Formulario oculto (style="display: none;") -->
    <form id="formularioNuevoContacto" class="border p-3 rounded mb-3 bg-light" style="display: none;">
        <h5>Nuevo Contacto</h5>
        <div class="mb-2">
            <input type="text" id="nombreContacto" class="form-control" placeholder="Nombre completo">
        </div>
        <div class="mb-2">
            <input type="text" id="aliasContacto" class="form-control" placeholder="Alias">
        </div>
        <div class="mb-2">
            <input type="text" id="cbuContacto" class="form-control" placeholder="Número de cuenta (10 dígitos numéricos)">
        </div>
        <!-- Contenedor para mostrar errores de validación -->
        <div id="errorValidacion" class="text-danger mb-2" style="display: none;"></div>
        
        <button type="submit" class="btn btn-success">Guardar</button>
        <button type="button" id="btnCancelarContacto" class="btn btn-secondary">Cancelar</button>
    </form>

    <!-- REQUISITO 4: Sección de envío de dinero (Oculta por defecto) -->
    <div id="seccionEnviarDinero" class="mt-4 border p-3 rounded shadow-sm" style="display: none;">
        <h5>Enviar dinero a: <span id="nombreDestinatario" class="text-primary"></span></h5>
        <input type="number" id="montoEnviar" class="form-control mb-3" placeholder="Monto a enviar" required>
        <button id="btnEnviarDinero" class="btn btn-primary w-100 btn-lg">Enviar dinero</button>
    </div>

    <!-- REQUISITO 5: Mensaje de confirmación -->
    <div id="mensajeConfirmacion" class="mt-3"></div>

    <br>
    <a href="menu.html" class="btn btn-secondary mt-3">Volver al Menú Principal</a>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="Assets/js/script.js"></script>
</body>
<!-- Matias -->
</html>
